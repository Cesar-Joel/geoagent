[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geoagent"
dynamic = ["version"]
description = "Agentes distribuidos para procesamiento geoespacial con backend central."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
geoagent-agent = "geoagent.agent.cli:main"
geoagent-backend = "geoagent.backend.cli:main"

[tool.setuptools.dynamic]
version = { attr = "geoagent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# ruff formatea bloques de código dentro de Markdown; docs y specs aprobados no se tocan.
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["geoagent"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
